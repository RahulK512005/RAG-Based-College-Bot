services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: college-rag-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt && python app/database/seed.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true

  # 2. React + Vite Frontend Static Site
  - type: static
    name: college-rag-frontend
    buildCommand: "cd frontend && npm install --ignore-scripts && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
